name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore tests/EfCoreNPlusOneGuard.Tests.csproj

      - name: Build
        run: dotnet build tests/EfCoreNPlusOneGuard.Tests.csproj --no-restore -c Release

      - name: Test
        run: dotnet test tests/EfCoreNPlusOneGuard.Tests.csproj --no-build -c Release --logger trx
